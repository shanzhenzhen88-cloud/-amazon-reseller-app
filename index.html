<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Amazon Reseller App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Amazon Reseller App</h1>
    <p>Turn an Amazon purchase into a ready-to-post Facebook / Mercari listing.</p>
  </header>

  <main>
    <section class="card">
      <label>Product title<input id="title" placeholder="e.g. Ninja Air Fryer 5 QT" /></label>
      <div class="grid">
        <label>Your cost ($)<input id="cost" type="number" step="0.01" inputmode="decimal" placeholder="39.99" /></label>
        <label>Target price ($)<input id="price" type="number" step="0.01" inputmode="decimal" placeholder="65" /></label>
      </div>
      <label>Condition<select id="condition"><option>New</option><option>Like New</option><option>Good</option><option>Used</option></select></label>
      <label>Notes<textarea id="notes" rows="4" placeholder="Sealed box, pickup location, color, size, etc."></textarea></label>
      <button id="generate">Generate listing</button>
    </section>

    <section class="card" id="resultCard" hidden>
      <div class="result-head"><h2>Listing draft</h2><button class="secondary" id="copy">Copy</button></div>
      <textarea id="result" rows="12"></textarea>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <button class="secondary" id="share">Share</button>
        <button class="secondary" id="save">Save draft</button>
      </div>
    </section>

    <section class="card">
      <div class="result-head"><h2>Saved drafts</h2><button class="secondary" id="clear">Clear</button></div>
      <div id="drafts" class="drafts"><p class="muted">No saved drafts yet.</p></div>
    </section>
  </main>

  <footer>Designed for quick use on iPhone.</footer>
  <script src="app.js"></script>
</body>
</html>
